<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Page not found — Shenyu Wu</title>
  <style>
    :root{--bg:#f6f7f4;--ink:#111512;--muted:#677068;--accent:#1f4b3a;--line:#dfe4dd}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#fafbf8 0%,var(--bg) 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(680px,calc(100% - 40px));padding:54px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 24px 70px rgba(25,38,30,.08)}
    .code{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase} h1{margin:12px 0 12px;font-size:clamp(42px,8vw,74px);line-height:1;letter-spacing:-.055em} p{color:var(--muted);font-size:18px;line-height:1.6} a{display:inline-flex;margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--accent);color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="code">404 · wushenyu.com</div>
    <h1>This page isn’t here.</h1>
    <p>The address may have changed, or the page may never have existed. The homepage is one click away.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
